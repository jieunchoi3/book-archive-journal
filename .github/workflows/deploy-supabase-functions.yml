name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main, cursor/reading-archive-spa]
    paths:
      - 'planner/supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy wishlist-enrich
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Skipping deploy: add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repo secrets."
            exit 0
          fi
          supabase functions deploy wishlist-enrich --project-ref "$SUPABASE_PROJECT_REF"
